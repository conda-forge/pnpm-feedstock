schema_version: 1

context:
  version: "12.3.1"

package:
  name: pnpm
  version: ${{ version }}

source:
  url: https://github.com/pnpm/pnpm/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 24984620f95e2236a5d60ddbaeaad6dc54663e27eee8b29ffa24f13dd8fe16de

build:
  number: 3

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: target_platform != "win-arm64"
      then:
        - make
    - nodejs
    - if: not win
      then:
        - file
    - if: win and target_platform != "win-arm64"
      then:
        - m2-sed
    - if: not win
      then:
        - sed
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - pnpm --help
      - if: target_platform == "win-arm64"
        then:
          - pnpm --version
          - node -e "const actual = process.platform + '/' + process.arch; console.log(actual); if (actual !== 'win32/arm64') process.exit(1)"
  - package_contents:
      bin:
        - if: unix
          then:
            - pn
            - pnpx
            - pnx
        - pnpm
      files:
        - if: unix
          then:
            - lib/node_modules/pnpm/*
          else:
            - Library/share/pnpm/*
      strict: true

about:
  license: MIT
  license_file:
    - LICENSE
    - ThirdPartyLicenses.txt
  summary: 📦🚀 Fast, disk space efficient package manager
  homepage: https://github.com/pnpm/pnpm

extra:
  recipe-maintainers:
    - JaninaWibkerQC
    - xhochy
    - pavelzw
