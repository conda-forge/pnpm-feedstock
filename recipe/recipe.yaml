schema_version: 1

context:
  name: pnpm
  version: "12.18.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/${{ name }}/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 1e5c9587b93e85d18cf405992c0748bab89558ac139f5c87d7d010aa88b85822

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: target_platform != "win-arm64"
      then:
        - make
    - nodejs
    - if: not win
      then:
        - file
    - if: win and target_platform != "win-arm64"
      then:
        - m2-sed
    - if: not win
      then:
        - sed
  host:
    - nodejs
  run:
    - nodejs

tests:
  - script:
      - pnpm --help
      - if: target_platform == "win-arm64"
        then:
          - pnpm --version
          - node -e "const actual = process.platform + '/' + process.arch; console.log(actual); if (actual !== 'win32/arm64') process.exit(1)"
  - package_contents:
      bin:
        - if: unix
          then:
            - pn
            - pnpx
            - pnx
        - pnpm
      files:
        - if: unix
          then:
            - lib/node_modules/pnpm/*
          else:
            - Library/share/pnpm/*
      strict: true

about:
  license: MIT
  license_file:
    - LICENSE
    - ThirdPartyLicenses.txt
  summary: 📦🚀 Fast, disk space efficient package manager
  homepage: https://github.com/pnpm/pnpm

extra:
  recipe-maintainers:
    - xhochy
    - pavelzw
